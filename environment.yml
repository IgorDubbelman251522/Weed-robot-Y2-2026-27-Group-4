name: weed-robot
# conda-forge only: the old pytorch channel gives a PyTorch that crashes on Windows next to newer MKL/OpenMP
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=*=cpu*
  - torchvision
  - pip
  - numpy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - pillow
  - opencv
  - pyyaml
  - jupyterlab
  - ipykernel
  - pytest
  - pip:
      - timm
      - transformers  # CLIP scene filter in tools/, Grounding DINO auto-labels
      - ultralytics  # YOLO detector (notebooks/06_detection_colab.ipynb)
      - albumentations
      - streamlit
      - mlflow
      - grad-cam
variables:
  # MKL and PyTorch load two copies of the same OpenMP runtime on Windows; without this, torch won't import
  KMP_DUPLICATE_LIB_OK: "TRUE"
