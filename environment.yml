name: weed-robot
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pytorch
  - torchvision
  - pip
  - numpy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - pillow
  - opencv
  - pyyaml
  - jupyterlab
  - ipykernel
  - pytest
  - pip:
      - timm
      - transformers  # CLIP scene filter in tools/, Grounding DINO auto-labels
      - ultralytics  # YOLO detector (notebooks/06_detection_colab.ipynb)
      - albumentations
      - streamlit
      - mlflow
      - grad-cam